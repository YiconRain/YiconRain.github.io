---
layout: archive
title: "Blog"
permalink: /blog/
author_profile: false
---

{% assign posts = site.blogs | sort: "date" | reverse %}

{% for post in posts %}
  <article style="margin-bottom: 2.2em; padding-bottom: 1.4em; border-bottom: 1px solid #f0f0f0;">
    <h2 style="margin-bottom: 0.15em;">
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>
    <p style="margin: 0 0 0.6em; color: #6c757d; font-size: 0.85em;">
      <time>{{ post.date | date: "%Y-%m-%d" }}</time>
    </p>
    <p style="margin: 0;">{{ post.description | truncate: 320 }}</p>
  </article>
{% else %}
  <p>No blog posts yet.</p>
{% endfor %}
