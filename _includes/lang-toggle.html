{% if page.slug and page.lang %}
  {% assign lang_alt = "zh" %}
  {% assign lang_alt_label = "中文" %}
  {% if page.lang == "zh" %}
    {% assign lang_alt = "en" %}
    {% assign lang_alt_label = "English" %}
  {% endif %}
  <div class="blog-lang-toggle">
    <a href="{{ base_path }}/blog/{{ page.slug }}-{{ lang_alt }}/" title="Switch to {{ lang_alt_label }}">{{ lang_alt_label }}</a>
  </div>
{% endif %}
